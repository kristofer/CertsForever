{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}{{.Org}} Certificates{{end}}</title>
{{if .NoIndex}}<meta name="robots" content="noindex">{{end}}
{{block "meta" .}}{{end}}
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="{{if .User}}/admin{{else}}/{{end}}">{{.Org}}</a>
  <span class="brand-sub">Certificates</span>
  {{with .User}}
  <nav class="usernav" aria-label="Account">
    <a href="/admin">Clients</a>
    {{if .IsSuper}}<a href="/super">Platform</a>{{end}}
    <a href="/account">{{.DisplayName}}</a>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button class="btn-link" type="submit">Sign out</button></form>
  </nav>
  {{end}}
</header>
<main{{if .User}} class="console"{{end}}>
{{block "content" .}}{{end}}
</main>
<footer class="foot{{if .User}} console{{end}}">
  <a href="/verify">Verify a certificate</a>
  <span aria-hidden="true">·</span>
  <a href="{{.SiteURL}}">{{.Org}}</a>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
